name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli="$(node bin/shomero.mjs --version)"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$cli" ] || [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME, bin/shomero.mjs $cli, package.json $pkg: bump both before tagging." >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/shomero.mjs install.sh --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
